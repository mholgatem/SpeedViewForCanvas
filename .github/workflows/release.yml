name: Release

# Run by hand from the Actions tab ("Run workflow"). It:
#   1. sets the new version in package.json (WXT copies it into both manifests),
#   2. runs every check, then builds the Chrome, Firefox, and sources zips,
#   3. commits the version bump to main, tags it vX.Y.Z, and creates a GitHub release,
#   4. uploads the zips to the Chrome Web Store and Firefox Add-ons for review.
# The stores sign the extension themselves once it passes review; nothing is signed here.
# Store credentials live in the "stores" environment (see RELEASING.md).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version: "patch", "minor", "major", or an exact number like 1.2.0'
        required: true
        default: patch
      release_notes:
        description: Release notes (shown on GitHub and Firefox Add-ons)
        required: false
        default: ''
      submit_chrome:
        description: Submit to the Chrome Web Store
        type: boolean
        default: true
      submit_firefox:
        description: Submit to Firefox Add-ons
        type: boolean
        default: true
      dry_run:
        description: Dry run (check everything and the store logins, but don't commit, tag, or upload)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Set the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          case "$REQUESTED" in
            patch|minor|major) ;;
            *)
              # Chrome only accepts plain dotted numbers, so no "-beta" style suffixes.
              if ! [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::Version must be patch, minor, major, or X.Y.Z (got '$REQUESTED')"
                exit 1
              fi ;;
          esac
          npm version "$REQUESTED" --no-git-tag-version --allow-same-version=false
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build:chrome
      - run: npm run build:firefox
      - name: No external URLs in store builds (FERPA guard)
        run: npm run check:external -- .output/chrome-mv3 .output/firefox-mv3
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Build the store zips
        run: npm run zip:all
      - name: Check the zips
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd .output
          for browser in chrome firefox; do
            zip="speedview-for-canvas-$VERSION-$browser.zip"
            actual=$(unzip -p "$zip" manifest.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
            [ "$actual" = "$VERSION" ] || { echo "::error::$zip has version $actual"; exit 1; }
          done
          # The sources zip goes to Mozilla's reviewers: make sure no secrets or test output slipped in.
          if unzip -Z1 "speedview-for-canvas-$VERSION-sources.zip" | grep -E '(^|/)\.env|test-results/|node_modules/'; then
            echo "::error::The sources zip contains files that shouldn't be uploaded"
            exit 1
          fi
          ls -l speedview-for-canvas-$VERSION-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: store-zips
          path: .output/speedview-for-canvas-${{ steps.version.outputs.version }}-*.zip
          if-no-files-found: error
          # .output starts with a dot, and upload-artifact skips hidden folders by default.
          include-hidden-files: true

      - name: Commit, tag, and create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ inputs.release_notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main "v$VERSION"
          gh release create "v$VERSION" .output/speedview-for-canvas-$VERSION-*.zip \
            --title "v$VERSION" --notes "${NOTES:-SpeedView for Canvas v$VERSION}"

  # One job per store, so "Re-run failed jobs" retries only the store that failed.
  chrome:
    needs: build
    if: ${{ inputs.submit_chrome }}
    runs-on: ubuntu-latest
    # Holds the store secrets. Add yourself as a required reviewer on this environment
    # to get one last "approve" button before anything is uploaded.
    environment: stores
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && 'main' || format('v{0}', needs.build.outputs.version) }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: store-zips
          path: zips

      - name: Submit to the Chrome Web Store
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: npx wxt submit $DRY_RUN_FLAG --chrome-zip "zips/speedview-for-canvas-$VERSION-chrome.zip"

  firefox:
    needs: build
    if: ${{ inputs.submit_firefox }}
    runs-on: ubuntu-latest
    # Holds the store secrets. Add yourself as a required reviewer on this environment
    # to get one last "approve" button before anything is uploaded.
    environment: stores
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && 'main' || format('v{0}', needs.build.outputs.version) }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: store-zips
          path: zips

      - name: Submit to Firefox Add-ons
        env:
          FIREFOX_EXTENSION_ID: speedview@mholgatem.github.io
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          # Release notes for users, and the build steps and lint explanations for reviewers.
          node -e '
            const [notes, version] = process.argv.slice(1);
            const approval = [
              "Build: Node.js 20+ (CI uses Node 24). Run `npm ci` then `npm run build:firefox`; output is .output/firefox-mv3/.",
              "Bundled with WXT (Vite). Libraries are installed from npm at the versions in package-lock.json.",
              "All innerHTML uses receive highlight.js-escaped text or DOMPurify-sanitized HTML (src/viewer/views.ts, src/render/sanitize.ts).",
              "The Function/import() warnings are inside bundled docx-preview and pdf.js; dynamic imports only load files bundled in the extension, and the CSP disallows eval and remote scripts.",
            ].join("\n");
            const metadata = { version: { approval_notes: approval, release_notes: { "en-US": notes || `SpeedView for Canvas v${version}` } } };
            require("fs").writeFileSync("amo-metadata.json", JSON.stringify(metadata, null, 2));
          ' "$NOTES" "$VERSION"
          npx wxt submit $DRY_RUN_FLAG \
            --firefox-zip "zips/speedview-for-canvas-$VERSION-firefox.zip" \
            --firefox-sources-zip "zips/speedview-for-canvas-$VERSION-sources.zip" \
            --firefox-amo-metadata-file amo-metadata.json
